<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Construcción · UNAL Medellín</title>
  <meta name="description" content="Pregrado en Construcción de la Facultad de Arquitectura, Universidad Nacional de Colombia, Sede Medellín: información del programa, malla curricular interactiva, perfil del egresado, grupos estudiantiles y semilleros de investigación.">
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#33363B">
  <link rel="apple-touch-icon" href="img/app/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Construcción UNAL">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/inicio.css">
  <link rel="stylesheet" href="css/sofia.css">
  <script src="js/sofia.js" defer></script>
</head>
<body data-pagina="inicio">

  <div id="barra"></div>

<!-- PORTADA -->
  <section class="portada foto foto--entrada" id="inicio">
    <div class="contenedor portada__contenido plano-marco">
      <!-- MARCADORES DE PLANO ARQUITECTÓNICO -->
      <span class="mira-plano mira-plano--tl" aria-hidden="true"></span>
      <span class="mira-plano mira-plano--tr" aria-hidden="true"></span>
      <span class="mira-plano mira-plano--bl" aria-hidden="true"></span>
      <span class="mira-plano mira-plano--br" aria-hidden="true"></span>

      <div class="portada__logo-wrap">
        <img class="portada__logo" src="img/logo-construccion.svg" alt="Logo de Construcción · Facultad de Arquitectura" width="130" height="130">
      </div>
      <p class="portada__lugar">Facultad de Arquitectura · Universidad Nacional de Colombia · Sede Medellín</p>

      <h1 class="portada__titulo">
        <span class="portada__antetitulo">Pregrado en</span>
        <span class="letras-varsity" data-texto="Construcción">Construcción</span>
      </h1>

      <ul class="portada__cifras" id="portada-cifras" aria-label="Datos clave del programa"></ul>

      <div class="portada__escala-tecnica" aria-hidden="true">
        <div class="cota-replanteo-portada">
          <span class="cota-replanteo-portada__linea"></span>
          <span class="cota-replanteo-portada__texto">PLANO GENERAL ARQ-001 · PROYECTO PREGRADO EN CONSTRUCCIÓN · N.P.T. ±0.00m</span>
          <span class="cota-replanteo-portada__linea"></span>
        </div>
      </div>
    </div>
  </section>

  <main>

    <!-- EL PROGRAMA: se carga al abrir la página -->
    <section class="seccion programa" id="programa" aria-labelledby="programa-titulo">
      <div class="contenedor" id="programa-contenido">
        <p class="cargando">Cargando programa…</p>
      </div>
    </section>

    <!-- FORTALEZAS Y DIFERENCIALES ÚNICOS DE LA CARRERA -->
    <section class="seccion fortalezas" id="fortalezas" aria-labelledby="fortalezas-titulo">
      <div class="contenedor" id="fortalezas-contenido">
        <p class="cargando">Cargando fortalezas…</p>
      </div>
    </section>

    <!-- PERFIL DEL EGRESADO: se carga cuando la persona se acerca -->
    <section class="seccion perfil" id="perfil" aria-labelledby="perfil-titulo" data-carga="perfil">
      <div class="contenedor" id="perfil-contenido">
        <p class="cargando">Cargando perfil…</p>
      </div>
    </section>

    <!-- GRUPOS ESTUDIANTILES Y SEMILLEROS: se carga cuando la persona se acerca -->
    <section class="grupos" id="grupos" aria-labelledby="grupos-titulo" data-carga="grupos">
      <div class="contenedor" id="grupos-contenido">
        <p class="cargando">Cargando grupos…</p>
      </div>
    </section>

  </main>

  <div id="pie"></div>

  <script src="js/comun.js"></script>
  <script src="js/instalar.js"></script>
  <script src="js/inicio.js"></script>
</body>
</html>
